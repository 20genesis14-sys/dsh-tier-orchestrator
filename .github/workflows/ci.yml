name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The smoke suite imports the real bundle, which needs the harness tool
      # DSL and schemastery packages (devDependencies, exact versions matching
      # the deployment). The root package carries no peerDependencies (they are
      # advisory service requirements only): npm's peer-tree resolution against
      # newly published harness versions crashed arborist, hit ERESOLVE, or
      # produced false "up to date" no-ops on npm 10.
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node --test "tests/**/*.test.mjs"
      # Packaging regression: the published tarball must keep every runtime
      # surface (lib tree, the patch manifest, docs).
      - run: |
          PACKED=$(npm pack --dry-run --json)
          for path in \
            "lib/index.js" "lib/core/guard.js" "lib/core/routing.js" \
            "lib/dsh/services.js" "lib/dsh/routing-seam.js" \
            "cordis.patch.yml" "CHANGELOG.md" "LICENSE" "README.md"; do
            echo "$PACKED" | grep -q "\"path\": \"$path\"" || { echo "missing from tarball: $path"; exit 1; }
          done
          echo "tarball contains all required files"
