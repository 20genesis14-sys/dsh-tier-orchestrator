name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The smoke suite imports the real bundle, which needs the harness tool
      # DSL and schemastery packages (devDependencies, exact versions). Peer
      # resolution is skipped and audit/fund disabled: the root package's rc
      # peer ranges and newly published harness versions made both unpinned
      # installs and explicit-arg installs flaky on npm 10 (arborist crashes,
      # ERESOLVE, and false "up to date" no-ops).
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: node --check lib/index.js
      - run: node --check lib/pure.js
      - run: node --test "tests/**/*.test.mjs"
