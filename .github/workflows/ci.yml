name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The smoke suite imports the real bundle, which needs the harness tool
      # DSL and schemastery packages (available on the public npm registry).
      # Versions are pinned and audit/fund disabled: the unpinned resolution
      # intermittently hit the npm arborist crash "Cannot read properties of
      # null (reading 'children')" on the runner.
      - run: npm install --no-save --no-audit --no-fund --legacy-peer-deps @deepseek-ai/dsh-tools@0.0.1-rc.1 @deepseek-ai/schemastery@3.18.1
      - run: node --check lib/index.js
      - run: node --check lib/pure.js
      - run: node --test "tests/**/*.test.mjs"
