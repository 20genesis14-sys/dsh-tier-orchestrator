name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The smoke suite imports the real bundle, which needs the harness tool
      # DSL and schemastery packages (devDependencies, exact versions matching
      # the deployment). The root package carries no peerDependencies (they are
      # advisory service requirements only): npm's peer-tree resolution against
      # newly published harness versions crashed arborist, hit ERESOLVE, or
      # produced false "up to date" no-ops on npm 10.
      - run: npm install --no-audit --no-fund
      - run: node --check lib/index.js
      - run: node --check lib/pure.js
      - run: node --check lib/preset-sync.js
      # The WebUI client is hand-authored CJS for the ModuleLoader; syntax
      # check it so a future edit cannot ship a broken bundle.
      - run: node --check client/client.js
      - run: node --test "tests/**/*.test.mjs"
      # Packaging regression: the published tarball must keep every runtime
      # surface (lib, the agent-plane preset, the WebUI client, the patch).
      - run: |
          PACKED=$(npm pack --dry-run --json)
          for path in \
            "lib/index.js" "lib/pure.js" "lib/preset-sync.js" \
            "client/client.js" "cordis.patch.yml" \
            "agent-presets/tiered/agent.cordis.yml" \
            "agent-presets/tiered/preset.yml" \
            "CHANGELOG.md" "LICENSE" "README.md"; do
            echo "$PACKED" | grep -q "\"path\": \"$path\"" || { echo "missing from tarball: $path"; exit 1; }
          done
          echo "tarball contains all required files"